name: Release

# On push of version number tag, this workflow will:
# - Create a GitHub release with generated release notes
# - Close the milestone of the same name (if it exists)


on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      - name: Close milestone
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          number=$(gh api --paginate "repos/$GITHUB_REPOSITORY/milestones?state=open" \
            --jq '.[] | select(.title == env.TAG) | .number')
          if [ -z "$number" ]; then
            echo "No open milestone named $TAG; nothing to close."
            exit 0
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/milestones/$number" -f state=closed
